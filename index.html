<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Petit Bavard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Monoton&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5; --panel:#FFFFFF; --ink:#14203F; --muted:#5E687C; --line:#D5DAE3; --chip:#F2F4F8;
  --navy:#1B2A5B; --navy-deep:#0F1A3C; --org:#EE7B22; --org-ink:#B9580C; --org-soft:#FFF0E2;
  --grey:#8A93A6; --grey-soft:#EEF0F4; --red:#C62828; --red-soft:#FDECEA;
  --cell:#FFFFFF; --cellhead:#F2F4F8;
  --sans:'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gap:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1330; --panel:#121E46; --ink:#E7EBF6; --muted:#9AA6C4; --line:#24346B; --chip:#1A295A;
  --navy:#9DB2F0; --navy-deep:#0B1535; --org:#FF9A45; --org-ink:#FFAA5E; --org-soft:#3A2616;
  --grey:#8C97B5; --grey-soft:#1A2753; --red:#FF6B6B; --red-soft:#3A1720;
  --cell:#0F1A3E; --cellhead:#16244F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--org);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;padding:1vh 1vw;display:grid;grid-template-rows:auto 1fr auto;gap:var(--gap)}
.homelink{border:0;background:none;cursor:pointer;padding:0}
.h1btn{font:inherit;color:inherit;letter-spacing:inherit}
.homenav{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:13px;font-weight:600}
.homenav svg{width:15px;height:15px;color:var(--org-ink)}
.homenav[aria-current="true"]{background:var(--org-soft);border-color:var(--org);color:var(--org-ink)}
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:6px}
.hcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--ink);min-height:132px}
.hcard:hover{border-color:var(--org)}
.hcard .top{display:flex;align-items:center;gap:8px}
.hcard .no{font:600 12px var(--mono);color:var(--muted)}
.hcard .top .badge{margin-left:auto}
.hcard b{font-size:17px;color:var(--navy);letter-spacing:-.01em;line-height:1.25} :root[data-theme="dark"] .hcard b{color:#fff}
.hcard .sub{font-size:12.5px;color:var(--muted);line-height:1.45}
.hcard .foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.hcard .foot .count{min-width:22px;height:18px;padding:0 6px;border-radius:9px;background:var(--org);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.hcard.soon{background:var(--chip)}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 12px;font-size:12.5px;color:var(--muted)}
.crumbs .cbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--org);background:var(--org);color:#fff;border-radius:16px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
.crumbs .cbtn:hover{background:var(--org-ink);border-color:var(--org-ink);color:#fff}
.crumbs .cbtn svg{width:13px;height:13px}
.crumbs .lnk{border:0;background:none;padding:0;cursor:pointer;color:var(--org-ink);font-weight:600;font-size:12.5px}
.crumbs .sep{color:var(--grey)}
.site-foot{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.site-foot a{color:var(--org-ink);text-decoration:none;font-weight:600}
header{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;column-gap:18px;min-height:46px}
.brand{font-family:'Monoton','Schibsted Grotesk',system-ui,sans-serif;font-size:clamp(1.6rem,2.4vw,2.1rem);line-height:1;letter-spacing:.02em;color:var(--navy);user-select:none}
:root[data-theme="dark"] .brand{color:var(--org)}
:root[data-theme="dark"] .sec{background:#1C2C66}
h1{margin:0;color:var(--org-ink);font-size:clamp(1.2rem,2.2vw,1.9rem);font-weight:700;letter-spacing:-.025em;line-height:1}
h1 small{font-size:.5em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:10px}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:18px;height:18px}
:root[data-theme="dark"] .crumbs .cbtn{color:#0A1330}
:root[data-theme="dark"] .theme-btn{background:var(--org);color:#0A1330;border-color:transparent}
.search{width:clamp(200px,22vw,300px);display:flex;align-items:center;gap:6px;padding:0 10px;height:36px;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--muted)}
.search svg{width:15px;height:15px;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:13px var(--sans);outline:none}
.search kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px}
.search:focus-within{border-color:var(--org)} .search:focus-within kbd{display:none}

.main{display:grid;grid-template-columns:minmax(230px,16fr) 84fr;gap:var(--gap);min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;flex:none;min-height:40px}
.panel-head .hint{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
.panel-body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}

/* Sidebar */
.side nav{padding:6px}
.cat+.cat{margin-top:5px}
.sec{width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:0;cursor:pointer;padding:7px 10px;border-radius:8px;background:var(--navy-deep);color:#8F9BB8;font-size:12px;line-height:1.3}
.sec-text{flex:1;min-width:0}
.sec b{display:block;color:#F3F5FA;font-size:13px;font-weight:600}
.sec .num{flex:none;font:600 11px var(--mono);color:#8F9BB8;width:18px}
.sec .count{flex:none;min-width:22px;height:18px;padding:0 6px;border-radius:9px;background:var(--org);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.sec .chev{flex:none;width:14px;height:14px;color:#F3F5FA;transition:transform .2s}
.sec[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sec.cur{box-shadow:inset 3px 0 0 var(--org)}
.items{list-style:none;margin:4px 0 2px;padding:0 0 0 6px}
.items[hidden]{display:none}
.items button{width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:5px 8px;border-radius:6px;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:6px}
.items button:hover{background:var(--chip)}
.items button[aria-current="true"]{background:var(--org-soft);color:var(--org-ink);font-weight:600}
.items .lv{margin-left:auto;font-size:10px;color:var(--muted);font-weight:500}
.items .seen{margin-left:auto;color:var(--org);font-size:11px;font-weight:700}
.cat[hidden]{display:none}
.nomatch{margin:12px;color:var(--muted);font-size:13px;text-align:center}
.nomatch[hidden]{display:none}
.vhits{margin:4px 0 8px}
.vhits .lbl{font-size:11.5px;color:var(--muted);padding:6px 6px 4px;font-weight:600}

/* Page */
.page{padding:16px 22px 48px;max-width:1240px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.B{background:var(--grey-soft);color:var(--ink)}
.badge.A{background:var(--navy);color:#fff;border-color:transparent}
:root[data-theme="dark"] .badge.A{color:#0A1330}
.badge.M{background:var(--org);color:#fff;border-color:transparent}
.pickers{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{display:flex;flex-direction:column;gap:2px}
.pick span{font-size:10.5px;color:var(--muted);font-weight:600;padding-left:12px}
.pick select,.pick input{height:34px;border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--ink);padding:0 12px;font-size:13px;max-width:290px;outline:none}
.pick select:focus,.pick input:focus{border-color:var(--org)}
.pick input{width:170px}
.page h2{margin:14px 0 4px;font-size:30px;letter-spacing:-.02em;color:var(--navy);line-height:1.1}
.page h2 small{font-size:.5em;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:10px}
:root[data-theme="dark"] .page h2{color:#fff}
.page-intro{font-size:14.5px;color:var(--muted);line-height:1.55;max-width:78ch;margin:4px 0 16px}
.tabhead{display:flex;align-items:center;gap:10px;margin:24px 0 10px}
.tabhead span{font-weight:700;font-size:14.5px;padding:4px 12px;border-radius:6px;background:var(--navy);color:#fff}
:root[data-theme="dark"] .tabhead span{color:#0A1330}
.tabhead i{flex:1;height:1px;background:var(--line)}
.ptabs{margin:10px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
.ptabs button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 12px;font:600 12.5px var(--sans);cursor:pointer;color:var(--ink)}
.ptabs button[aria-selected="true"]{background:var(--org);border-color:var(--org);color:#fff}
.ptabs button:hover{border-color:var(--org)}

.conj-grid{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,9fr);gap:12px;margin-top:12px;align-items:start}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel);display:flex;flex-direction:column;gap:10px;min-width:0}
.card h4{margin:0;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h4 .badge{font-size:11px;padding:2px 8px}
.card p{margin:0;font-size:13.5px;line-height:1.55}
.vhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vhead .inf{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
:root[data-theme="dark"] .vhead .inf{color:#fff}
.vhead .en{color:var(--muted);font-size:14px}
.vtags{display:flex;gap:6px;flex-wrap:wrap}
.gloss{font-size:13px;padding:6px 10px;border-radius:6px;background:var(--org-soft);line-height:1.45}
.gloss b{color:var(--org-ink)}
table.conj{border-collapse:collapse;width:100%;font-size:14.5px}
.conj td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
.conj tr:first-child td{border-top:0}
.conj td.who{color:var(--muted);font-size:12px;width:120px}
.conj td.say{width:36px;text-align:right}
.conj .pr{color:var(--muted)}
.conj .ax{color:var(--navy);font-weight:600}
:root[data-theme="dark"] .conj .ax{color:#C9D5FA}
.conj .end{color:var(--org-ink);font-weight:700}
.conj .na{color:var(--grey);font-style:italic;font-size:13px}
.sbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-grid;place-items:center;color:var(--ink);flex:none;vertical-align:middle}
.sbtn svg{width:13px;height:13px}
.sbtn:hover{border-color:var(--org);color:var(--org-ink)}
.ex{border-left:3px solid var(--org);background:var(--chip);border-radius:0 8px 8px 0;padding:9px 12px;display:flex;gap:10px;align-items:flex-start}
.ex .t{flex:1;min-width:0}
.ex .fr{font-size:14.5px;font-weight:600;line-height:1.45}
.ex .tr{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.syn{padding:10px 12px;border-radius:8px;background:var(--chip);font:13px/1.7 var(--mono);overflow-x:auto;white-space:pre-wrap}
.syn .o{color:var(--org-ink);font-weight:600}
.syn .n{color:var(--navy);font-weight:600}
:root[data-theme="dark"] .syn .n{color:#C9D5FA}
.co{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.co li{font-size:13.5px;line-height:1.55;padding:9px 12px;border-radius:8px;background:var(--chip);border-left:3px solid var(--navy)}
.co li.warn{border-left-color:var(--org);background:var(--org-soft)}
.co li b{color:var(--org-ink)}
.exs{display:grid;gap:8px}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.mini h5{margin:0 0 6px;font-size:13.5px;color:var(--org-ink);display:flex;justify-content:space-between;align-items:center;gap:6px}
.mini h5 button{border:0;background:none;color:var(--muted);font-size:11.5px;cursor:pointer;text-decoration:underline}
.mini table.conj{font-size:13.5px}
.mini .conj td{padding:4px 6px}

.sc-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.sc{border-collapse:collapse;width:100%;font-size:13.5px}
.sc th{position:sticky;top:0;text-align:left;background:var(--navy);color:#fff;padding:9px 12px;font-weight:600;white-space:nowrap}
:root[data-theme="dark"] .sc th{color:#0A1330}
.sc td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
.sc td .tr{color:var(--muted);font-size:12.5px}
.sc td.w{font-weight:700;white-space:nowrap}
.sc tr.click{cursor:pointer} .sc tr.click:hover td{background:var(--chip)}
.g{display:inline-block;font:700 10.5px var(--mono);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.g.m{background:var(--navy);color:#fff} :root[data-theme="dark"] .g.m{color:#0A1330}
.g.f{background:var(--org);color:#fff}
.g.p{background:var(--grey-soft);color:var(--ink);border:1px solid var(--line)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.letter{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.letter:hover{border-color:var(--org)}
.letter .lname{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;color:inherit}
.letter .xbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:5px 8px;cursor:pointer;text-align:left;color:var(--ink)}
.letter .xbtn:hover{border-color:var(--org)}
.letter .xbtn svg{width:13px;height:13px;flex:none;color:var(--org-ink)}
.letter .xbtn em{font-style:normal;font-weight:600;font-size:13px;display:block}
.letter .xbtn small{font-size:11.5px;color:var(--muted);display:block}
.letter b{font-size:24px;color:var(--navy)} :root[data-theme="dark"] .letter b{color:#fff}
.letter span{font-size:12px;color:var(--muted)}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tool input{height:38px;border:1px solid var(--line);border-radius:19px;background:var(--panel);padding:0 14px;width:160px;font-size:15px;outline:none}
.tool input:focus{border-color:var(--org)}
.out-card{padding:14px 16px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px}
:root[data-theme="dark"] .out-card{background:var(--navy-deep);border:1px solid var(--line)}
.out-card .val{font:600 20px/1.35 var(--sans);flex:1}
.out-card .lbl{font-size:12px;opacity:.75}
.out-card .sbtn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.soon{border:1px dashed var(--line);border-radius:10px;padding:16px 18px;background:var(--chip)}
.soon h4{margin:0 0 6px;font-size:15px}
.soon p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.btn{border:1px solid var(--org);background:var(--org);color:#fff;border-radius:18px;padding:7px 16px;font-weight:600;font-size:13px;cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--org-ink)}
.cefr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.callout{border:1px solid var(--line);border-left:3px solid var(--org);background:var(--org-soft);border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.callout p{margin:0;font-size:13.5px;line-height:1.5}
details.reveal{margin-top:6px} details.reveal summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--org-ink);margin-bottom:6px}
.tr-in{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:8px 10px;font:14px var(--sans);resize:vertical}
.tr-in:focus{outline:none;border-color:var(--org)}
.card p i{font-style:italic}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

@media (max-width: 1100px){
  body{overflow:auto;height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .side .panel-body{max-height:42vh}
  .panel-body{overflow:visible}
  .side .panel-body{overflow:auto}
  header{grid-template-columns:auto 1fr auto;row-gap:8px}
  .search{grid-column:1/-1;width:100%;order:3}
  .conj-grid,.two{grid-template-columns:1fr}
  .pickers{margin-left:0;width:100%}
  .pick{flex:1 1 150px} .pick select,.pick input{width:100%;max-width:none}
  .page{padding:14px 14px 40px}
}
@media (max-width: 600px){ h1 small{display:none} .conj td.who{width:84px} }
.ai-fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:3px solid var(--org);background:var(--navy);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 24px rgba(15,26,60,.28);z-index:50;padding:0;overflow:hidden}
.ai-fab svg{width:26px;height:26px}
.ai-fab.has-av svg{width:100%;height:100%}
.ai-fab:hover{transform:translateY(-2px)}
:root[data-theme="dark"] .ai-fab{background:var(--org);color:#0A1330}
.ai-panel{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(114px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 24px));height:min(600px,calc(100vh - 150px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 48px rgba(15,26,60,.30);display:flex;flex-direction:column;z-index:60;overflow:hidden}
.ai-panel[hidden]{display:none}
.ai-panel.choosing{height:auto}
.ai-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy-deep);color:#fff}
.ai-av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--navy);border:2px solid var(--org)}
.ai-av svg{width:100%;height:100%}
.ai-id{flex:1;min-width:0;display:flex;flex-direction:column}
.ai-id b{font-size:15px}
.ai-id span{font-size:12px;color:#AEB8D2}
.ai-hbtn{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center}
.ai-hbtn:hover{background:rgba(255,255,255,.12)}
.ai-hbtn svg{width:17px;height:17px}
.ai-hbtn[hidden]{display:none}
.ai-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ai-msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.ai-msg.me{justify-content:flex-end}

function resolveIrr(inf){

}

const VOWEL = /^[aeiouyhéèêëàâîïôûœæ]/i;

function assemble(tokens, base){

  let out = [], speak = [];

    const tk = tokens[i], nx = tokens[i+1];
    let t = tk.t, glue = false;
    if(ELIDE.has(t) && nx && opensVowel(nx.t, base)){ t = t.slice(0,-1)+"'"; glue = true; }
    out.push((tk.h && !glue ? tk.h : `<span class="${tk.c||''}">${esc(t)}</span>`) + (glue||!nx ? '' : ' '));

function conjugate(v, tense){

    const ref = ['toi','nous','vous'];
    const pre = lcp(F.imp);
    F.imp.forEach((w,k)=>{
      const tk = [{t:pre,c:''}];
      let html = `<span>${esc(pre)}</span><span class="end">${esc(w.slice(pre.length))}</span>` + (v.pr ? `<span class="pr">-${ref[k]}</span>` : '');
      rows.push({who: who[k] + ' ' + lab[k], html, say: w + (v.pr ? '-'+ref[k] : '')});

    return rows;
  }
  for(const i of idx){
    const subjP = F.imp1 ? 'il' : PRON[i];
    let tk = [];
    if(tense==='subj') tk.push({t:'que',c:'pr'});

      tk.push({t:v.base,c:'end'});

}

const DBL = new Set('stop plan drop travel prefer regret admit commit control chat permit submit step beg rob fit grab clap nod shop jog occur refer transmit dip tap'.split(' '));

    pres: `${S} ${pres}${R}`,
    pc: (b==='be' && rest==='born') ? `${S} was born` : `${S} ${pastBe}${R} / ${S} ${it?'has':'have'} ${enPP(b)}${R}`,

/* Number words */
const U = ['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
function n100(n){
  if(n<17) return U[n];
  if(n<20) return 'dix-'+U[n-10];
  const t = Math.floor(n/10), r = n%10, T = ['','','vingt','trente','quarante','cinquante','soixante'];
  if(t<7) return r===0 ? T[t] : r===1 ? T[t]+' et un' : T[t]+'-'+U[r];
  if(t===7) return r===1 ? 'soixante et onze' : 'soixante-'+n100(10+r);
  return n===80 ? 'quatre-vingts' : 'quatre-vingt-'+n100(n-80);
}
function n1000(n){ const h=Math.floor(n/100), r=n%100; if(!h) return n100(r); const pre = h===1 ? 'cent' : U[h]+' cent'+(r===0?'s':''); return r ? pre+' '+n100(r) : pre; }
function numFr(n){
  if(n===0) return 'zéro';
  const th=Math.floor(n/1000), r=n%1000;
  let pre = '';
  if(th) pre = th===1 ? 'mille' : n1000(th).replace(/(cent|vingt)s$/,'$1')+' mille';
  return [pre, r? n1000(r):''].filter(Boolean).join(' ');
}
function timeFr(d){
  const h=d.getHours(), m=d.getMinutes();
  if(h===12 && m===0) return 'Il est midi.';
  if(h===0 && m===0) return 'Il est minuit.';
  const hw = numFr(h).replace(/un$/,'une');
  return `Il est ${hw} heure${h>1?'s':''}${m? ' '+numFr(m).replace(/un$/,'une'):''}.`;
}

/* Speech */
let FRV = null;
const canSpeak = 'speechSynthesis' in window;
function loadVoices(){ if(!canSpeak) return; const vs = speechSynthesis.getVoices(); FRV = vs.find(v=>/^fr[-_]FR/i.test(v.lang)) || vs.find(v=>/^fr/i.test(v.lang)) || null; }
if(canSpeak){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
let curUtter = null;   // keep a reference so the browser does not discard the utterance mid-speech
function say(t){
  if(!canSpeak || !t) return;
  const synth = window.speechSynthesis;
  const speakNow = () => {
    if(!FRV) loadVoices();
    curUtter = new SpeechSynthesisUtterance(t);
    curUtter.lang = 'fr-FR'; if(FRV) curUtter.voice = FRV; curUtter.rate = .88;
    curUtter.onend = curUtter.onerror = () => { curUtter = null; };
    synth.resume(); synth.speak(curUtter);
  };
  if(synth.speaking || synth.pending){ synth.cancel(); setTimeout(speakNow, 150); }
  else speakNow();
}
const sbtn = (t, label) => canSpeak ? `<button class="sbtn" data-say="${esc(t)}" aria-label="Listen: ${esc(label||t)}">${SPEAKER}</button>` : '';
document.addEventListener('click', e=>{ const b = e.target.closest('[data-say]'); if(b){ say(b.dataset.say); } });

/* Sidebar */
let openSecs = new Set();   // all categories closed on load
function buildNav(q=''){
  const nq = norm(q.trim());
  let html = '', any = false;
  if(nq){
    const hits = VERBS.filter(v => norm(v.inf).includes(nq) || norm(v.base).startsWith(nq) || norm(v.en).includes(nq)).slice(0,12);
    if(hits.length){ any = true;
      html += `<div class="vhits"><div class="lbl">Verbs</div><ul class="items">${hits.map(v=>`<li><button data-verb="${esc(v.inf)}">${esc(v.inf)}<span class="lv">${esc(v.en.split(',')[0])}</span></button></li>`).join('')}</ul></div>`;
    }
  }
  for(const s of SECTIONS){
    const secHit = nq && norm(s.t).includes(nq);
    const items = s.items.filter(([id,t]) => !nq || secHit || norm(t).includes(nq));
    if(!items.length) continue;
    any = true;
    const open = nq ? true : openSecs.has(s.n);
    html += `<div class="cat"><button class="sec${state.sec===s.n?' cur':''}" data-sec="${s.n}" aria-expanded="${open}">
      <span class="num">${String(s.n).padStart(2,'0')}</span><span class="sec-text"><b>${esc(s.t)}</b>${esc(s.lv)}</span><span class="count">${s.items.length}</span>${CHEV}</button>
      <ul class="items"${open?'':' hidden'}>${items.map(([id,t])=>{
        const cur = state.sec===s.n && state.item===id;
        const key = s.n+'-'+id;
        const tag = s.soon ? `<span class="lv">Phase ${s.soon}</span>` : (seen.has(key) ? '<span class="seen" aria-label="visited">✓</span>' : '');
        return `<li><button data-go="${s.n}|${id}"${cur?' aria-current="true"':''}>${esc(t)}${tag}</button></li>`;
      }).join('')}</ul></div>`;
  }
  const HOME_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>';
  if(!nq) html = `<button class="homenav" data-home="1"${state.sec===0?' aria-current="true"':''}>${HOME_ICON}Home</button>` + html;
  $('nav').innerHTML = html;
  $('nomatch').hidden = any;
}
$('nav').addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if(g){ const [n,id] = g.dataset.go.split('|'); go(+n, id); return; }
  const v = e.target.closest('[data-verb]');
  if(v){ openVerb(v.dataset.verb, 'pres'); $('search').value=''; buildNav(); return; }
  const s = e.target.closest('[data-sec]');
  if(s){ const n = +s.dataset.sec; openSecs = openSecs.has(n) ? new Set() : new Set([n]); buildNav($('search').value); }
});
$('search').addEventListener('input', e=> buildNav(e.target.value));
document.addEventListener('keydown', e=>{ if(e.key==='/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); $('search').focus(); } });
$('totalHint').textContent = `${SECTIONS.length} sections, ${VERBS.length} verbs`;

const backStack = [];
function go(n, id, keepVerb, fromBack){
  if(!fromBack && !(state.sec===n && state.item===id)) backStack.push({...state});
  showAll = false;
  if(n===6 && state.sec!==6 && !keepVerb){ verbSel = null; groupSel = 'er'; }
  state = {sec:n, item:id}; store.set('state', state);
  seen.add(n+'-'+id); store.set('seen', [...seen]);
  openSecs = new Set([n]);
  buildNav($('search').value);
  renderPage();
  $('pageWrap').scrollTop = 0;
  if(window.innerWidth <= 1100) $('page').scrollIntoView({block:'start'});
}
function openVerb(inf, tense){ verbSel = inf; groupSel = VMAP[inf].group; showAll = false; go(6, tense || (state.sec===6 ? state.item : 'pres'), true); }

/* ---------- Essential Tenses page ---------- */
function pageTense(s, tid){
  const T = TENSES.find(t=>t.id===tid), info = TENSE_INFO[tid];
  const v = verbSel ? VMAP[verbSel] : null;
  const group = v ? v.group : groupSel;
  const opts = GROUPS.map(([g,l])=>`<option value="${g}"${g===group?' selected':''}>${esc(l)} (${VERBS.filter(x=>x.group===g).length})</option>`).join('');
  const vs = VERBS.filter(x=>x.group===group).sort((a,b)=>a.inf.localeCompare(b.inf,'fr'));
  const vopts = `<option value=""${v?'':' selected'}>Choose a verb…</option>` + vs.map(x=>`<option value="${esc(x.inf)}"${v && x.inf===v.inf?' selected':''}>${esc(x.inf)}  (${esc(x.en.split(',')[0])})</option>`).join('');
  const pickers = `<div class="pickers">
    <label class="pick"><span>Verb type</span><select id="pGroup">${opts}</select></label>
    <label class="pick"><span>Verb</span><select id="pVerb">${vopts}</select></label>
    <label class="pick"><span>Find any verb</span><input id="pFind" list="allVerbs" placeholder="Type a verb…" autocomplete="off"></label>
    <datalist id="allVerbs">${VERBS.map(x=>`<option value="${esc(x.inf)}">${esc(x.en)}</option>`).join('')}</datalist>
  </div>`;
  const pills = `<div class="ptabs" role="tablist"><button role="tab" id="allBtn" aria-selected="${showAll}">All tenses</button>${TENSES.map(t=>`<button role="tab" data-jump="6|${t.id}" aria-selected="${!showAll && t.id===tid}">${esc(t.fr)}</button>`).join('')}</div>`;
  const gname = GROUPS.find(x=>x[0]===group)[1];
  if(!v){
    const empty = `<div class="card"${showAll?' style="grid-column:1/-1"':''}><h4>${esc(gname)}</h4><p style="color:var(--muted)">${esc(GROUP_NOTE[group]||'')}</p><div class="soon"><p>Choose a verb from the <b>Verb</b> list above to see its conjugation.</p></div></div>`;
    const rightE = showAll ? '' : `<div class="card"><h4>How the ${esc(T.fr.toLowerCase())} works</h4><p>${info.use}</p>${formationBlock(null, tid)}
      <div class="exs">${info.ex.map(e=>exBox(e[0],e[1])).join('')}</div>${co(info.tips.map((t,i)=> i===0?'!'+t:t))}</div>`;
    return `${metaRow(s.lv, s.t, pickers)}<h2>${showAll?'All tenses':esc(T.fr)+`<small>${esc(T.en)}</small>`}</h2>${pills}<div class="conj-grid">${empty}${rightE}</div>`;
  }
  const rows = conjugate(v, tid);
  const gl = rows.none ? '' : `<div class="gloss"><b>In English:</b> ${esc(gloss(v, tid))}</div>`;
  const left = showAll
    ? `<div class="card" style="grid-column:1/-1">${verbHead(v)}${exBox(v.fr, v.tr)}</div><div style="grid-column:1/-1">${allTensesGrid(v)}</div>`
    : `<div class="card">${verbHead(v)}${gl}${conjTable(v, tid)}${GROUP_NOTE[v.group] ? `<p style="font-size:13px;color:var(--muted)">${esc(GROUP_NOTE[v.group])}</p>`:''}${tabHead('Example')}${exBox(v.fr, v.tr)}</div>`;
  const right = showAll ? '' : `<div class="card"><h4>How the ${esc(T.fr.toLowerCase())} works</h4><p>${info.use}</p>${formationBlock(v, tid)}
      <div class="exs">${info.ex.map(e=>exBox(e[0],e[1])).join('')}</div>${co(info.tips.map((t,i)=> i===0?'!'+t:t))}</div>`;
  const h2 = showAll ? `All tenses<small>${esc(v.inf)}, ${esc(v.en.split(',')[0])}</small>` : `${esc(T.fr)}<small>${esc(T.en)}</small>`;
  return `${metaRow(s.lv, s.t, pickers)}<h2>${h2}</h2>${pills}<div class="conj-grid">${left}${right}</div>`;
}

/* Formation box: only the pattern that applies to the selected verb */
function formationBlock(v, tid){
  if(tid!=='pres') return `<div class="syn">${TENSE_INFO[tid].form}</div>`;
  const lines = TENSE_INFO.pres.form.split('\n');
  const pick = {er:0, ercg:0, erst:0, ir2:1, re:2}[v ? v.group : groupSel];
  if(!v) return pick===undefined ? `<div class="syn">Irregular pattern: each verb has its own forms.</div>` : `<div class="syn">${lines[pick]}</div>`;
  const F = forms(v);
  const pre = lcp(F.pres);
  const own = F.imp1 ? `il ${esc(F.pres[2])}`
    : F.pres.map(w=>`${esc(pre)}<span class="o">${esc(w.slice(pre.length))}</span>`).join(', ');
  const rule = pick===undefined
    ? `<span class="n">${esc(v.base)}</span> follows its own pattern. Learn the six forms:`
    : `<span class="n">${esc(v.base)}</span> follows the ${['-ER','-IR (finir)','-RE (vendre)'][pick]} pattern:`;
  return `<div class="syn">${rule}\n${own}</div>`;
}

function bindPage(){
  const g = $('pGroup'), vv = $('pVerb'), f = $('pFind'), all = $('allBtn');
  if(g) g.addEventListener('change', ()=>{ groupSel = g.value; verbSel = null; renderPage(); $('pVerb')?.focus(); });
  if(vv) vv.addEventListener('change', ()=>{ verbSel = vv.value || null; if(verbSel) groupSel = VMAP[verbSel].group; renderPage(); $('pVerb')?.focus(); });
  if(f) f.addEventListener('change', ()=>{ const q = f.value.trim(); const hit = VMAP[q] || VERBS.find(x=>norm(x.inf)===norm(q)) || VERBS.find(x=>norm(x.inf).startsWith(norm(q))); if(hit){ verbSel = hit.inf; groupSel = hit.group; renderPage(); } else { f.value=''; f.placeholder='Not in the list yet'; } });
  if(all) all.addEventListener('click', ()=>{ showAll = !showAll; renderPage(); });
  const num = $('numIn'); if(num){ const upd=()=>{ const n = Math.max(0, Math.min(999999, parseInt(num.value||'0',10)||0)); const w = numFr(n); $('numOut').textContent = w; $('numSay').dataset.say = w; }; num.addEventListener('input', upd); upd(); }
  const pb = $('pronBtn');
  if(pb){
    const run = () => { const raw = $('pronIn').value.trim(); const n = parseInt(raw,10);
      if(raw==='' || isNaN(n) || n<0 || n>999999){ $('pronMsg').textContent = 'Enter a whole number from 0 to 999 999.'; return; }
      const w = numFr(n); $('pronMsg').textContent = w; say(w); };
    pb.addEventListener('click', run);
    $('pronIn').addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
  }
  const clk = $('clockOut'); if(clk){ const t = timeFr(new Date()); clk.textContent = t; $('clockSay').dataset.say = t; }
}

/* =================== PHASE 3a: TRANSLATION TECHNIQUES =================== */
function practice(items){
  return `<div class="exs">${items.map((it,i)=>`<div class="card"><h4><span class="badge ${it.d==='fr'?'A':'M'}">${it.d==='fr'?'FR → EN':'EN → FR'}</span>Exercise ${i+1}</h4>
    <div class="ex"><div class="t"><div class="fr">${esc(it.src)}</div></div>${it.d==='fr'?sbtn(it.src):''}</div>
    <textarea class="tr-in" rows="2" placeholder="Write your translation here…" aria-label="Your translation"></textarea>
    <details class="reveal"><summary>Show a model translation</summary><div class="ex"><div class="t"><div class="fr">${esc(it.model)}</div><div class="tr">${esc(it.note)}</div></div>${it.d==='en'?sbtn(it.model):''}</div></details></div>`).join('')}</div>`;
}
function tpage(s, o){
  return head(s, o.t, o.fr, o.intro) +
    (o.def ? `<div class="callout"><p>${o.def}</p></div>` : '') +
    tabHead('Examples') + simpleTable(['French','English','What happens'], o.ex.map(r=>[speakCell(r[0]), esc(r[1]), esc(r[2])])) +
    (o.extra || '') +
    tabHead('Watch out') + co(o.tips) +
    tabHead('Practice') + `<p class="page-intro">Write your own version first, then compare. A model translation is one good answer, not the only one.</p>` + practice(o.pr) +
    tabHead('Related') + related(o.rel);
}
P['15-borrow'] = s => tpage(s,{t:'Borrowing & calque',fr:"L'emprunt et le calque",
  intro:'The first two of the seven translation procedures described by Vinay and Darbelnet in 1958. Both stay very close to the source language.',
  def:'<b>Borrowing</b> takes a word unchanged from the other language (le week-end, déjà vu). <b>Calque</b> translates a phrase word by word, copying its structure (gratte-ciel from sky-scraper).',
  ex:[["le week-end","the weekend","borrowing from English into French"],["un rendez-vous","a rendezvous","borrowing from French into English"],["le baby-sitting","babysitting","borrowing"],["un gratte-ciel","a skyscraper","calque: gratter (scrape) + ciel (sky)"],["la lune de miel","the honeymoon","calque"],["la guerre froide","the Cold War","calque from English"]],
  tips:["!Borrowing is a style choice: it can add local colour (a café, a croissant), but too many borrowings make a text hard to read.","A calque becomes an error when the structure does not exist in the target language: « Je suis froid » for I am cold is a calque mistake. French says <b>J'ai froid</b>.","Official French bodies recommend French alternatives for some English borrowings: le courriel for email, le logiciel for software."],
  pr:[{d:'fr',src:"Nous avons passé le week-end à Paris.",model:"We spent the weekend in Paris.",note:'"Week-end" is an English borrowing, so it goes straight back.'},
      {d:'en',src:"It was a real déjà vu moment.",model:"J'ai eu une vraie impression de déjà-vu.",note:'English borrowed déjà vu; French still needs a full phrase around it.'},
      {d:'en',src:"I am cold.",model:"J'ai froid.",note:'A word-for-word calque (je suis froid) would be wrong. French uses avoir.'}],
  rel:[['15|literal','Literal translation'],['15|false','False friends'],['4|avoir','Avoir expressions']]});

P['15-literal'] = s => tpage(s,{t:'Literal translation',fr:'La traduction littérale',
  intro:'Word-for-word translation that is grammatical and natural in the target language. It works when the two languages share structure.',
  def:'Use literal translation when it produces a correct, natural sentence. If it sounds odd, move to one of the oblique procedures: transposition, modulation, equivalence or adaptation.',
  ex:[["Le chat est sur la table.","The cat is on the table.","works perfectly"],["Où est la gare ?","Where is the station?","works perfectly"],["J'ai faim.","I am hungry.","literal (I have hunger) fails, so the structure changes"],["Il me manque.","I miss him.","literal (he is missing to me) fails: the roles swap"]],
  tips:["!The test: read your translation aloud. If a native speaker would never say it, literal translation is not enough.","Literal translation is the default for technical and legal texts, where accuracy matters more than style.","Beware of word order: French adjectives usually follow the noun, English adjectives come before it."],
  pr:[{d:'fr',src:"Le train part à huit heures.",model:"The train leaves at eight o'clock.",note:'A literal translation works here.'},
      {d:'fr',src:"Elle a vingt ans.",model:"She is twenty.",note:'Literal (she has twenty years) fails: English uses to be for age.'},
      {d:'en',src:"The red car is in the garage.",model:"La voiture rouge est dans le garage.",note:'Literal, except the adjective moves after the noun.'}],
  rel:[['15|borrow','Borrowing & calque'],['15|transp','Transposition'],['3|adj','Adjectives']]});

P['15-transp'] = s => tpage(s,{t:'Transposition',fr:'La transposition',
  intro:'Changing the grammatical category of a word without changing the meaning: a noun becomes a verb, a verb becomes an adverb, and so on.',
  def:'French tends to prefer nouns (a nominal style), while English often prefers verbs. Transposition is the tool for moving between the two.',
  ex:[["Après son départ…","After he left…","noun (départ) → verb (left)"],["Dès son arrivée…","As soon as she arrived…","noun → verb"],["Il traversa la rivière à la nage.","He swam across the river.","noun phrase (à la nage) → verb (swam)"],["Je viens de finir.","I have just finished.","verb (venir de) → adverb (just)"],["Défense de fumer","No smoking","noun phrase → gerund"]],
  tips:["!Translating French nouns into English nouns often sounds heavy. « La réalisation du projet » is often better as <b>completing the project</b>.","The reverse works too: English verbs often become nouns in formal French. Before he arrived → <b>Avant son arrivée</b>.","Transposition is compulsory when the structure does not exist (venir de + infinitive) and optional when it simply improves style."],
  pr:[{d:'fr',src:"Avant son départ, il a appelé sa mère.",model:"Before he left, he called his mother.",note:'The noun départ becomes the verb left.'},
      {d:'fr',src:"Elle vient d'arriver.",model:"She has just arrived.",note:'Venir de becomes the adverb just.'},
      {d:'en',src:"After the meeting ended, we went home.",model:"Après la fin de la réunion, nous sommes rentrés.",note:'The verb ended becomes the noun la fin, a typical French choice.'}],
  rel:[['15|modul','Modulation'],['6|pc','Passé composé']]});

P['15-modul'] = s => tpage(s,{t:'Modulation',fr:'La modulation',
  intro:'Changing the point of view: saying the same thing from another angle, because the target language sees the situation differently.',
  def:'Modulation changes perspective: positive ↔ negative, part ↔ whole, active ↔ passive, cause ↔ effect. The meaning stays; the way of seeing it changes.',
  ex:[["Ce n'est pas difficile.","It's easy.","negative → positive"],["Il me manque.","I miss him.","the subject and object swap"],["le château d'eau","the water tower","castle → tower: different image"],["Défense de stationner","No parking","prohibition seen from another angle"],["On parle anglais ici.","English is spoken here.","active (on) → passive"],["Ne quittez pas.","Please hold.","don't hang up → hold (on the phone)"]],
  tips:["!French uses <b>on</b> where English often uses the passive: On m'a volé mon sac → My bag was stolen.","Modulation is often fixed by usage. On the phone, « Ne quittez pas » is always Please hold, never Don't leave.","Overusing modulation can drift away from the author's meaning. Use it only when the direct view sounds unnatural."],
  pr:[{d:'fr',src:"Ce n'est pas impossible.",model:"It's possible. / It could happen.",note:'Double negative becomes positive, or keep the nuance with could.'},
      {d:'fr',src:"On m'a offert un livre.",model:"I was given a book.",note:'Active with on becomes an English passive.'},
      {d:'en',src:"Please hold the line.",model:"Ne quittez pas.",note:'The fixed French phone expression sees it as do not leave.'}],
  rel:[['15|transp','Transposition'],['15|equiv','Equivalence'],['3|pron','On']]});

P['15-equiv'] = s => tpage(s,{t:'Equivalence',fr:"L'équivalence",
  intro:'Rendering the same situation with completely different words. Used for idioms, proverbs, sound effects and fixed expressions.',
  def:'Each language has its own ready-made expressions. A good translator finds the expression a native speaker would use in the same situation, not the same words.',
  ex:[["Il pleut des cordes.","It's raining cats and dogs.","different image, same meaning"],["Coûter les yeux de la tête","To cost an arm and a leg","eyes → arm and leg"],["Avoir un coup de foudre","To fall in love at first sight","no literal match"],["Quand les poules auront des dents","When pigs fly","hens with teeth → flying pigs"],["Aïe !","Ouch!","sound effects differ"],["Bon appétit !","Enjoy your meal!","fixed social formula"]],
  tips:["!Never translate an idiom word for word. « Il pleut des cordes » as it is raining ropes means nothing in English.","If no equivalent exists, explain the meaning plainly rather than inventing a fake idiom.","Check register: an English equivalent should be as formal or as casual as the French original."],
  pr:[{d:'fr',src:"Ce téléphone coûte les yeux de la tête.",model:"This phone costs an arm and a leg.",note:'Find the English idiom with the same meaning.'},
      {d:'fr',src:"Quand les poules auront des dents !",model:"When pigs fly!",note:'An impossible event, expressed with a different animal.'},
      {d:'en',src:"It's a piece of cake.",model:"C'est du gâteau. / C'est simple comme bonjour.",note:'French has its own image for easy things.'}],
  rel:[['15|adapt','Adaptation'],['12|idiom','Idioms (Phase 3)']]});

P['15-adapt'] = s => tpage(s,{t:'Adaptation',fr:"L'adaptation",
  intro:'Replacing a cultural reference that would not be understood in the target culture with one that has the same effect.',
  def:'Adaptation is the most free of the seven procedures. It changes the reference itself so that the reader reacts as the original reader would.',
  ex:[["le Tour de France","a major sporting event","explained or kept, depending on the reader"],["la galette des rois","a traditional Epiphany cake","explained for readers who do not know it"],["le baccalauréat","the school-leaving exam (like A levels)","comparison with a local equivalent"],["un repas de Noël","a festive family meal","may be adapted to Diwali or Thanksgiving in some texts"],["Monsieur Tout-le-Monde","the man in the street, Joe Bloggs","typical name changes by country"]],
  tips:["!Adaptation suits advertising, children's books, subtitles and humour. In academic, legal or literary translation, keeping the reference with a short explanation is usually better.","Adapting too much can erase the culture of the original. Ask: does the reader need to feel at home, or to discover something foreign?","Units can be adapted too: 30 degrees Celsius may need 86 °F for an American reader."],
  pr:[{d:'fr',src:"Il a eu son bac l'année dernière.",model:"He finished secondary school last year. / He passed his A levels last year.",note:'Explain or adapt the French exam for an English reader.'},

   ['passé composé','simple past or present perfect',speakCell("J'ai vu ce film. (I saw / have seen this film)")],
   ['imparfait','past continuous, used to, would',speakCell("Je lisais. (I was reading / I used to read)")],

P['15-case'] = s => head(s,'Literary case studies','Études de cas littéraires','Famous examples show that literary translation is a series of choices. Each case below is described and discussed rather than quoted.') +
  `<div class="exs">
   <div class="card"><h4>Camus, L'Étranger (1942)</h4><p><b>The title.</b> American editions call it <i>The Stranger</i>, British editions <i>The Outsider</i>. The French word means foreigner, stranger and outsider at once, and no single English word carries all three.</p><p><b>The opening word.</b> The novel begins with Meursault speaking of his mother as <b>maman</b>, a tender, childlike word. Early translators chose "Mother", which sounds cold. Matthew Ward's 1988 translation kept "Maman" in French. The choice changes how readers first meet the narrator.</p><p><b>Technique:</b> borrowing (keeping maman) versus equivalence (Mother, Mum).</p></div>
   <div class="card"><h4>Proust, À la recherche du temps perdu (1913–1927)</h4><p>C. K. Scott Moncrieff titled it <i>Remembrance of Things Past</i>, a line borrowed from Shakespeare's Sonnet 30. Later editions changed it to the literal <i>In Search of Lost Time</i>, which keeps Proust's idea of searching and of time that is both lost and wasted.</p><p><b>Technique:</b> adaptation (a familiar English literary echo) versus literal translation.</p></div>
   <div class="card"><h4>Balzac, Le Père Goriot (1835)</h4><p>Translated as <i>Old Goriot</i>, <i>Father Goriot</i> or simply <i>Le Père Goriot</i>. "Père" here is a familiar, slightly condescending way of naming an old man, not a priest and not "father" in the family sense. Each English title shifts the tone.</p><p><b>Technique:</b> modulation of tone, or borrowing the French title.</p></div>
   <div class="card"><h4>Hugo, Les Misérables (1862)</h4><p>The French title is almost always kept. "The Wretched" or "The Miserable Ones" were tried, but the borrowing won because the title had become famous on its own.</p><p><b>Technique:</b> borrowing.</p></div>
  </div>` +
  co(["!There is rarely one correct literary translation. A good translator can explain why they chose each solution, and what was gained and lost.","Ask three questions of any choice: what does it keep (meaning, sound, tone, culture)? What does it lose? Who is the reader?"]) +
  tabHead('Your turn') + co(["!Choose a short French paragraph you love. Translate it twice: once as literally as possible, once as naturally as possible. List three choices where the two versions differ, and name the technique behind each one."]) +
  tabHead('Related') + related([['15|borrow','Borrowing & calque'],['15|adapt','Adaptation'],['15|reg','Register & tone']]);

/* =================== PHASE 3b: READING, WRITING, VOCABULARY, THINKING =================== */
function readText(title, paras, opts={}){
  return `<div class="card" style="margin-bottom:10px"><h4>${esc(title)}${opts.tag?` <span class="badge B">${esc(opts.tag)}</span>`:''}</h4>
    ${canSpeak?`<div>${playBtns(paras.map(p=>p[0]).join(' '))}</div>`:''}
    ${paras.map(p=>`<div class="ex"><div class="t"><div class="fr" style="font-weight:500;line-height:1.6">${esc(p[0])}</div><details class="reveal"><summary>Translation</summary><div class="tr">${esc(p[1])}</div></details></div>${sbtn(p[0])}</div>`).join('')}</div>`;
}
function questions(qs){
  return `<div class="exs">${qs.map((q,i)=>`<div class="card"><p><b>${i+1}.</b> ${esc(q[0])}</p><details class="reveal"><summary>Answer</summary><div class="ex"><div class="t"><div class="fr">${esc(q[1])}</div><div class="tr">${esc(q[2]||'')}</div></div></div></details></div>`).join('')}</div>`;
}
function writeTask(list){
  return `<div class="exs">${list.map((w,i)=>`<div class="card"><h4><span class="badge M">Task ${i+1}</span>${esc(w[0])}</h4><textarea class="tr-in" rows="4" placeholder="Write in French here…"></textarea><details class="reveal"><summary>Show a model answer</summary><div class="ex"><div class="t"><div class="fr" style="white-space:pre-line">${esc(w[1])}</div><div class="tr" style="white-space:pre-line">${esc(w[2])}</div></div>${sbtn(w[1].replace(/\n/g,' '))}</div></details></div>`).join('')}</div>`;
}

const POEMS = [
 ['Pierre de Ronsard, « Mignonne, allons voir si la rose » (1550s)',

 ['Victor Hugo, « Demain, dès l\'aube » (1856)',

P['11-essay'] = s => head(s,'Essays','La dissertation','The French academic essay follows a strict structure. Mastering it is essential for degree-level work.') +
  simpleTable(['Part','Content','Useful phrases'],[
   ['Introduction','Hook (accroche), presentation of the subject, the question (problématique), announcement of the plan','Il convient de se demander si… / Nous verrons d\'abord… puis…'],

/* Persona voices: prefer a different French voice for each guide where the device has several */
function personaVoice(){
  if(!canSpeak) return null;
  const fr = speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));
  if(!fr.length) return null;
  const M = /thomas|nicolas|daniel|henri|paul|mathieu|antoine|male|homme/i, F = /am[eé]lie|audrey|marie|c[eé]line|aur[eé]lie|julie|virginie|female|femme|google fran/i;
  const want = persona==='therese' ? F : M;
  return fr.find(v=>want.test(v.name)) || (persona==='therese' ? fr[0] : (fr[1]||fr[0]));
}
function sayP(t){
  if(!canSpeak || !t) return;
  const synth = speechSynthesis;
  const go2 = () => { curUtter = new SpeechSynthesisUtterance(t); curUtter.lang='fr-FR'; const v = personaVoice(); if(v) curUtter.voice=v; curUtter.rate=.9; curUtter.pitch = persona==='therese' ? 1.1 : .95; synth.resume(); synth.speak(curUtter); };
  if(synth.speaking||synth.pending){ synth.cancel(); setTimeout(go2,150); } else go2();
}
document.addEventListener('click', e=>{ const b = e.target.closest('[data-sayp]'); if(b) sayP(b.dataset.sayp); });
const pbtn = t => canSpeak ? `<button class="sbtn" data-sayp="${esc(t)}" aria-label="Listen">${SPEAKER}</button>` : '';

/* ---------- Knowledge index built from the guide's own data ---------- */
let KB = null;
function buildKB(){
  const items = [];
  const addV = (str, page) => parseVocab(str).forEach(w=>items.push({fr:w.w, en:w.en, ex:w.fr, tr:w.tr, page}));
  for(const k in VOCAB) addV(VOCAB[k], k==='time' ? [2,'time'] : k==='days' ? [2,'days'] : [2,k]);
  [[FOOD,'food'],[GREET,'greet'],[FAMILY,'fam'],[OBJECTS,'obj']].forEach(([arr,id])=>arr.forEach(c=>addV(c[2],[2,id])));
  DAILY.forEach(c=>addV(c[2],[12,'daily']));
  PHRASES.forEach(c=>c[2].forEach(r=>items.push({fr:r[0], en:r[1], ex:r[3], tr:r[4], note:'Followed by: '+r[2], page:[15,'phr']})));
  IDIOMS.forEach(r=>items.push({fr:r[0], en:r[2], ex:r[3], tr:'', note:'Literally: '+r[1], page:[12,'idiom']}));
  FALSE.forEach(r=>items.push({fr:r[0], en:r[1], ex:'', tr:'', note:'False friend: '+r[2], page:[15,'false']}));
  KB = items.map(it=>({...it, nfr: norm(it.fr).replace(/^(le |la |les |l'|un |une |des )/,'').replace(/[«»!?.…]/g,'').trim(), nen: ' '+norm(it.en).replace(/[(),;!?.]/g,' ')+' '}));
}

/* ---------- Answer builders ---------- */
const goBtn = (n,id,label) => `<button class="ai-chip" data-ai-go="${n}|${id}">${esc(label)} →</button>`;
function topicLabel(n,id){ const s = secByN(n); const it = s && s.items.find(i=>i[0]===id); return it ? it[1] : s ? s.t : ''; }
function findVerb(q){
  const t = norm(q).replace(/[^a-z' -]/g,' ');
  for(const m of t.matchAll(/\b(se |s')?([a-z]+(?:er|ir|re|oir))\b/g)){ const k = (m[1]?(m[1]==="s'"?"s'":"se "):'')+m[2]; if(NVERB[k]) return NVERB[k]; if(NVERB[m[2]]) return NVERB[m[2]]; }
  const en = t.match(/(?:conjugate|conjugation of|conjuguer)\s+(?:to\s+)?([a-z]+)/);
  if(en){ const v = VERBS.find(x=>norm(x.en).split(',').some(m=>m.trim().replace(/^to /,'').split(' ')[0]===en[1])); if(v) return v; }
  return null;
}
function answerConj(v, q){
  const nq = norm(q); let tid = 'pres';
  for(const [re,id] of TENSE_WORDS) if(re.test(nq)){ tid = id; break; }
  if(tid==='all') return `${pick(PERSONA[persona].ok)} <b>${esc(v.inf)}</b> (${esc(v.en)}) in every tense is in the conjugator:<div class="ai-chips">${`<button class="ai-chip" data-open="${esc(v.inf)}" data-all="1">Open all tenses →</button>`}</div>`;
  const T = TENSES.find(t=>t.id===tid);
  return `${pick(PERSONA[persona].ok)} <b>${esc(v.inf)}</b> (${esc(v.en)}), <b>${esc(T.fr)}</b>:${conjTable(v, tid, false)}<div class="ai-note">${esc(gloss(v,tid)||'')}</div><div class="ai-chips"><button class="ai-chip" data-open="${esc(v.inf)}" data-tense="${tid}">Open in the conjugator →</button></div>`;
}
function lookup(q){
  if(!KB) buildKB();
  let t = norm(q).replace(/[?!.«»"]/g,' ').replace(/\s+/g,' ').trim();
  t = t.replace(/^(how do (i|you) say|how to say|what is|what's|what does|whats|meaning of|translate|translation of|comment dit-on|que veut dire|c'est quoi)\s+/,'')
       .replace(/\s+(in french|en francais|mean|means|in english|en anglais)$/,'').replace(/^(the|a|an|to)\s+/,'').replace(/^["']|["']$/g,'').trim();
  if(!t || t.length<2) return null;
  const scored = [];
  for(const it of KB){
    let sc = 0;
    if(it.nfr===t) sc = 100; else if(it.nfr.startsWith(t+' ') || it.nfr.startsWith(t)) sc = 70; else if(t.length>3 && it.nfr.includes(t)) sc = 50;
    if(it.nen.includes(' '+t+' ')) sc = Math.max(sc, it.nen.trim().startsWith(t) ? 90 : 60);
    if(sc) scored.push([sc,it]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  const seenFr = new Set(), top = [];
  for(const [,it] of scored){ if(seenFr.has(it.fr)) continue; seenFr.add(it.fr); top.push(it); if(top.length===3) break; }
  if(!top.length){
    const v = VERBS.find(x=>norm(x.inf)===t || norm(x.en).split(',').some(m=>m.trim().replace(/^to /,'')===t));
    if(v) return `${pick(PERSONA[persona].ok)} <div class="ai-item"><b>${esc(v.inf)}</b> ${pbtn(v.inf)} = ${esc(v.en)}<div>${esc(v.fr)} ${pbtn(v.fr)}</div><div class="ai-note">${esc(v.tr)}</div></div><div class="ai-chips"><button class="ai-chip" data-open="${esc(v.inf)}" data-tense="pres">Conjugate it →</button></div>`;
    if(typeof loadDict==='function'){
      const D = loadDict(), tt = t.replace(/^to /,'');
      const e = D.en.find(x=>x.n===tt), f = D.fr.find(x=>x.n===t.replace(/^(le |la |les |l'|un |une )/,''));
      if(e) return `${pick(PERSONA[persona].ok)} From the dictionary, <b>${esc(e.k)}</b> in French:${e.t.slice(0,4).map(x=>`<div class="ai-item">${gTag(x.g)} <b>${esc(x.w)}</b> ${pbtn(x.w)} ${pTag(x.p)}</div>`).join('')}<div class="ai-note">A word can have several meanings, so pick the one that fits your sentence.</div>`;
      if(f) return `${pick(PERSONA[persona].ok)} From the dictionary: <div class="ai-item"><b>${esc(f.k)}</b> ${gTag(f.g)} ${pbtn(f.k)} ${pTag(f.p)}<div>${esc(f.e)}</div></div>`;
    }
    return null;
  }
  return `${pick(PERSONA[persona].ok)} ${top.map(it=>`<div class="ai-item"><b>${esc(it.fr)}</b> ${pbtn(it.fr.split(' / ')[0])} = ${esc(it.en)}${it.note?`<div class="ai-note">${esc(it.note)}</div>`:''}${it.ex?`<div>${esc(it.ex)} ${pbtn(it.ex)}</div>`:''}${it.tr?`<div class="ai-note">${esc(it.tr)}</div>`:''}</div>`).join('')}<div class="ai-chips">${goBtn(top[0].page[0], top[0].page[1], 'See it in '+topicLabel(top[0].page[0], top[0].page[1]))}</div>`;
}
function findTopic(q){
  const words = norm(q).replace(/[^a-z\s-]/g,' ').split(/\s+/);
  const hits = [];
  for(const w of words){ const k = TOPIC_WORDS[w] || TOPIC_WORDS[w.replace(/s$/,'')]; if(k && !hits.some(h=>h[0]===k[0]&&h[1]===k[1])) hits.push(k); }
  if(!hits.length){
    for(const s of SECTIONS) for(const [id,t] of s.items){ const nt = norm(t); if(words.some(w=>w.length>4 && nt.includes(w))) hits.push([s.n,id]); }
  }
  if(!hits.length) return null;
  return `Here's where to learn that:<div class="ai-chips">${hits.slice(0,4).map(([n,id])=>goBtn(n,id,topicLabel(n,id))).join('')}</div>`;
}
function explainPage(){
  if(state.sec===0) return "You're on the home page. Each card is a section of the guide, from the alphabet (1) to Translation Techniques (15). Start with French Pronunciation if you're a beginner, or ask me to find any topic.";
  const s = secByN(state.sec), it = s.items.find(i=>i[0]===state.item) || s.items[0];
  if(s.n===6){
    const info = TENSE_INFO[state.item]; const tmp = document.createElement('div'); tmp.innerHTML = info.use;
    return `<b>${esc(it[1])}</b>: ${esc(tmp.textContent)}<div class="ai-note">Choose a verb type and a verb at the top of the page to see it conjugated, or ask me: "conjugate venir in the ${esc(it[1].toLowerCase())}".</div>`;
  }
  const page = $('page');
  const intro = page.querySelector('.page-intro')?.textContent || '';
  const parts = [...page.querySelectorAll('.tabhead span')].map(x=>x.textContent).filter(x=>!/^(Related|Practice|Your turn)$/.test(x));
  const ORDER = SECTIONS.flatMap(x=>x.items.map(i=>[x.n,i[0]])); const k = ORDER.findIndex(o=>o[0]===s.n && o[1]===it[0]); const nx = ORDER[k+1];
  return `<b>${esc(it[1])}</b> (${esc(s.t)}, ${esc(s.lv)}). ${esc(intro)}${parts.length?`<div class="ai-note">On this page: ${esc(parts.slice(0,6).join(', '))}.</div>`:''}${nx?`<div class="ai-chips">${goBtn(nx[0],nx[1],'Next: '+topicLabel(nx[0],nx[1]))}</div>`:''}`;
}
let quizN = 0;
function makeQuiz(){
  if(!KB) buildKB();
  quizN++;
  if(Math.random()<.5){
    const pool = KB.filter(i=>i.page[0]===2 && i.en.length<30);
    const a = pick(pool); const opts = new Set([a.en]); while(opts.size<3) opts.add(pick(pool).en);
    const arr = [...opts].sort(()=>Math.random()-.5);
    return `Quiz ! What does <b>${esc(a.fr)}</b> mean? ${pbtn(a.fr.split(' / ')[0])}<div class="ai-chips">${arr.map(o=>`<button class="ai-chip" data-quiz="${quizN}" data-ok="${o===a.en?1:0}" data-right="${esc(a.en)}">${esc(o)}</button>`).join('')}</div>`;
  }
  const vs = VERBS.filter(v=>['aux','er','ir2','re','rep','oir','irv'].includes(v.group));
  const v = pick(vs), tid = pick(['pres','pc','impf','fut']), F = conjugate(v, tid);
  if(F.none || F.length<6) return makeQuiz();
  const i = Math.floor(Math.random()*6), strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
  const right = strip(F[i].html);
  const others = new Set([right]); let guard = 0;
  while(others.size<3 && guard++<20){ const o = strip(conjugate(v, pick(['pres','pc','impf','fut','cond']).toString())[i]?.html || ''); if(o) others.add(o); }
  const arr = [...others].sort(()=>Math.random()-.5);
  const T = TENSES.find(t=>t.id===tid);
  return `Quiz ! <b>${esc(v.inf)}</b> in the <b>${esc(T.fr)}</b>, person: <b>${esc(PRON[i])}</b>?<div class="ai-chips">${arr.map(o=>`<button class="ai-chip" data-quiz="${quizN}" data-ok="${o===right?1:0}" data-right="${esc(right)}">${esc(o)}</button>`).join('')}</div>`;
}
function helpChips(){ return `<div class="ai-note">I can conjugate verbs, explain words and phrases, find topics, explain the page you're on, or quiz you.</div>`; }

function respond(q){
  const n = norm(q).trim();
  if(/^(bonjour|salut|hello|hi|hey|coucou|bonsoir)\b/.test(n) && n.split(' ').length<=3) return `${pick(['Bonjour !','Salut !','Coucou !'])} ${pbtn('Bonjour !')} What would you like to look at?`;
  if(/^(merci|thanks|thank you)/.test(n)) return `Avec plaisir ! ${pbtn('Avec plaisir !')}`;
  if(/^(help|aide|what can you do|que sais-tu faire)/.test(n)) return `Here's what I can do:${helpChips()}`;
  if(/quiz|test me|teste-moi|interroge/.test(n)) return makeQuiz();
  if(/explain (this|the) page|this page|cette page|explique/.test(n)) return explainPage();
  const v = findVerb(q);
  if(v && (/conjug|tense|temps|present|passe|futur|future|past|imparfait|imperfect|conditionnel|conditional|subj|imperatif|imperative|would|will|plus.que/.test(n) || n===norm(v.inf))) return answerConj(v, q);
  const lk = lookup(q); if(lk) return lk;
  if(v) return answerConj(v, q);
  const tp = findTopic(q); if(tp) return tp;
  return esc(PERSONA[persona].sorry);
}

/* =================== FLOATING DICTIONARY (FreeDict data, GNU GPL v2+) =================== */
let DICTN = null;
function loadDict(){
  if(DICTN) return DICTN;
  const en = [], fr = [];
  DICT_EN_RAW.split('\n').forEach(l=>{ const [k,v] = l.split('\t'); if(!k) return;
    en.push({k, n: norm(k).replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim(), t: v.split(';').map(x=>{ const [w,g,p] = x.split('|'); return {w,g,p}; })}); });
  DICT_FR_RAW.split('\n').forEach(l=>{ const [k,v] = l.split('\t'); if(!k) return; const [p,g,e] = v.split('|');
    fr.push({k, n: norm(k), p, g, e}); });
  return DICTN = {en, fr};
}
const POS_LABEL = {n:'noun', v:'verb', vi:'verb', vt:'verb', vr:'verb', adj:'adjective', adv:'adverb', prep:'preposition', pron:'pronoun', conj:'conjunction', interj:'interjection', num:'number', art:'article'};
const gTag = g => g==='m' ? '<span class="g m">m</span>' : g==='f' ? '<span class="g f">f</span>' : '';
const pTag = p => p ? `<span class="d-pos">${esc(POS_LABEL[p]||p)}</span>` : '';
const conjBtn = fr => { const v = NVERB[norm(fr)]; return v ? `<button class="ai-chip" data-open="${esc(v.inf)}" data-tense="pres">Conjugate →</button>` : ''; };
let dictMode = 'en';   // 'en' = EN to FR, 'fr' = FR to EN
function dictSearch(q){
  const D = loadDict(); if(!KB) buildKB();
  let t = norm(q).replace(/[?!.«»"]/g,'').replace(/\s+/g,' ').trim();
  if(dictMode==='en') t = t.replace(/^to /,''); else t = t.replace(/^(le |la |les |l'|un |une |se |s')/,'');
  if(t.length<1) return '';
  const out = [];
  // 1. the guide's own vocabulary first (with examples)
  const guide = KB.filter(it => dictMode==='en'
      ? (it.nen.trim().split(/,|\//)[0].trim().replace(/^to /,'')===t || it.nen.includes(' '+t+' ') && it.nen.trim().startsWith(t))
      : (it.nfr===t || it.nfr.split(' / ')[0]===t)).filter((it,i,a)=>a.findIndex(o=>o.fr===it.fr)===i).slice(0,3);
  guide.forEach(it=>out.push(`<div class="d-res guide"><div class="d-top"><b>${esc(dictMode==='en'?it.fr:it.fr)}</b> ${sbtn(it.fr.split(' / ')[0])}<span class="d-src">from the guide</span></div><div>${esc(it.en)}</div>${it.ex?`<div class="d-ex">${esc(it.ex)} ${sbtn(it.ex)}<div class="ai-note">${esc(it.tr)}</div></div>`:''}${conjBtn(it.fr)}</div>`));
  // 2. dictionary
  if(dictMode==='en'){
    const exact = D.en.filter(e=>e.n===t), pre = D.en.filter(e=>e.n!==t && e.n.startsWith(t)).slice(0, exact.length?5:10);
    [...exact, ...pre].forEach(e=>out.push(`<div class="d-res"><div class="d-top"><b>${esc(e.k)}</b></div>${e.t.map(x=>`<div class="d-line">${/^v/.test(x.p)?'':gTag(x.g)}<span class="d-fr">${esc(x.w)}</span> ${sbtn(x.w)} ${pTag(x.p)} ${conjBtn(x.w)}</div>`).join('')}</div>`));
  } else {
    const exact = D.fr.filter(e=>e.n===t), pre = D.fr.filter(e=>e.n!==t && e.n.startsWith(t)).slice(0, exact.length?5:10);
    [...exact, ...pre].forEach(e=>out.push(`<div class="d-res"><div class="d-top"><b>${esc(e.k)}</b> ${/^v/.test(e.p)?'':gTag(e.g)} ${sbtn(e.k)} ${pTag(e.p)}</div><div>${esc(e.e)}</div>${conjBtn(e.k)}</div>`));
  }
  if(!out.length){
    const v = dictMode==='fr' ? (NVERB[t] || null) : null;
    return `<div class="d-empty">No match for “${esc(q)}”. ${dictMode==='en'?'Try the base form of the word (eat, not eating).':'Try the infinitive for verbs (manger, not mangeons) and the masculine singular for adjectives.'} You can also ask Eugène.</div>`;
  }
  return out.join('');
}

function alphaWords(L){
  if(!KB) buildKB(); const D = loadDict(); const l = L.toLowerCase();
  const first = s => norm(s.replace(/^(le |la |les |l'|un |une )/i,''))[0];
  const seenW = new Set();
  const starter = KB.filter(it=>it.page[0]===2 && first(it.fr)===l && !seenW.has(it.fr) && seenW.add(it.fr));

  const more = D.fr.filter(e=>e.n[0]===l && e.k===e.k.toLowerCase() && e.k.length<=22 && !/[0-9]/.test(e.k) && !starterSet.has(e.n));

  const exp = [...explored].filter(w=>norm(w)[0]===L.toLowerCase()).length;
  const row = (fr, g, p, en, ex) => `<div class="wx-row${explored.has(fr)?' done':''}"><button class="wx-say" data-wx="${esc(fr)}" aria-label="Listen to ${esc(fr)}">${SPEAKER}</button><div class="wx-t"><div><b>${esc(fr)}</b> ${g==='m'?'<span class="g m">m</span>':g==='f'?'<span class="g f">f</span>':''} ${p?`<span class="d-pos">${esc(POS_LABEL[p]||p)}</span>`:''}</div><div class="wx-en">${esc(en)}</div>${ex?`<div class="wx-ex">${esc(ex)}</div>`:''}</div>${NVERB[norm(fr)]?`<button class="ai-chip" data-open="${esc(NVERB[norm(fr)].inf)}" data-tense="pres">Conjugate →</button>`:''}${explored.has(fr)?'<span class="wx-tick" aria-label="explored">✓</span>':''}</div>`;
  return `<div class="wx-head"><div><span class="wx-big">${L}</span><div><b>Words starting with ${L}</b><div class="wx-count">${total} words · you've explored ${exp}</div></div></div><button class="btn ghost" id="wxSurprise" title="Show a random French word that starts with this letter">🎲 Surprise me</button></div>
    ${alphaSurprise?`<div class="wx-surprise"><div class="wx-sl">Surprise word</div><div class="wx-sw"><b>${esc(alphaSurprise.k)}</b> ${!/^v/.test(alphaSurprise.p)&&alphaSurprise.g==='m'?'<span class="g m">m</span>':!/^v/.test(alphaSurprise.p)&&alphaSurprise.g==='f'?'<span class="g f">f</span>':''} ${alphaSurprise.p?`<span class="d-pos">${esc(POS_LABEL[alphaSurprise.p]||alphaSurprise.p)}</span>`:''} <button class="sbtn" data-say="${esc(alphaSurprise.k)}" aria-label="Listen">${SPEAKER}</button></div><div class="wx-en">${esc(alphaSurprise.e)}</div>${NVERB[alphaSurprise.n]?`<button class="ai-chip" data-open="${esc(NVERB[alphaSurprise.n].inf)}" data-tense="pres">Conjugate →</button>`:''}</div>`:''}
    ${RARE[L]?`<div class="callout" style="margin:10px 0 0"><p>${esc(RARE[L])}</p></div>`:''}
    ${starter.length?`<div class="wx-sub">Starter words <span>from the lessons</span></div>${starter.map(it=>row(it.fr, '', '', it.en, it.ex)).join('')}`:''}
    ${more.length?`<div class="wx-sub">Explore more <span>from the dictionary</span></div>${shown.map(e=>row(e.k, /^v/.test(e.p)?'':e.g, e.p, e.e)).join('')}${list.length>alphaShown?`<button class="btn ghost wx-more" id="wxMore">Show more (${list.length-alphaShown} left)</button>`:''}`:''}`;
}
P['1-alpha'] = s => {
  const snd = [['ou','/u/','vous, rouge','like "oo" in food'],['u','/y/','tu, rue','say "ee" with rounded lips'],['eu','/ø/','deux, bleu','like "uh" with rounded lips'],['oi','/wa/','moi, trois','"wa"'],['ai, ei','/ɛ/','lait, neige','like "e" in bed'],['au, eau','/o/','beau, chaud','like "o" in go, no glide'],['ch','/ʃ/','chat, chercher','like "sh"'],['gn','/ɲ/','montagne, campagne','like "ny" in canyon'],['qu','/k/','qui, quatre','a plain "k"'],['ill','/ij/','fille, famille','like "ee-y"'],['c + e, i','/s/','ce, merci','soft "s"'],['g + e, i','/ʒ/','manger, girafe','like "s" in pleasure'],['ph','/f/','photo, téléphone','"f"'],['th','/t/','thé, théâtre','a plain "t"']];
  return head(s,'Alphabet & sounds','L\'alphabet','Tap a letter to hear its name and see French words that start with it. Tap the example to hear it in a word.') +
   `<div class="alpha-wrap"><div class="letters sq">${ALPHA_L.map(([l,n,h,w,e])=>`<div class="letter${l===alphaSel?' sel':''}"><button class="lname" data-alpha="${l}" data-say="${esc(n)}" aria-label="Letter ${l}"><b>${l}</b><span>${esc(n)}, ${esc(h)}</span></button><button class="xbtn" data-say="${esc(w)}" aria-label="Listen to the example ${esc(w)}">${SPEAKER}<span><em>${esc(w)}</em><small>${esc(e)}</small></span></button></div>`).join('')}</div>
   <aside class="wx-panel card" id="wxPanel" aria-live="polite">${wordPanel()}</aside></div>` +
   tabHead('Key letter combinations') + simpleTable(['Letters','Sound','Examples','How to say it'], snd.map(r=>[esc(r[0]),`<span class="mono">${r[1]}</span>`,speakCell(r[2]),esc(r[3])])) +
   tabHead('Watch out') + co(['!The French <b>u</b> does not exist in English. Say "ee", then round your lips without moving your tongue: <b>tu</b>, <b>vu</b>, <b>rue</b>.','<b>ou</b> and <b>u</b> change meaning: <b>roue</b> (wheel) and <b>rue</b> (street), <b>vous</b> (you) and <b>vu</b> (seen).','When spelling aloud, say accents too: é is "e accent aigu", ç is "c cédille".']);
};
function refreshWords(){ const p = $('wxPanel'); if(p) p.innerHTML = wordPanel(); document.querySelectorAll('.letters.sq .letter').forEach(c=>c.classList.toggle('sel', c.querySelector('[data-alpha]').dataset.alpha===alphaSel)); }
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-alpha]'); if(a){ alphaSel = a.dataset.alpha; alphaShown = 20; alphaShuffle = null; alphaSurprise = null; refreshWords(); return; }
  const w = e.target.closest('[data-wx]'); if(w){ const fr = w.dataset.wx; say(fr); explored.add(fr); store.set('explored',[...explored]); refreshWords(); return; }
  if(e.target.closest('#wxMore')){ alphaShown += 20; refreshWords(); return; }
  if(e.target.closest('#wxSurprise')){
    const {more} = alphaWords(alphaSel); if(!more.length) return;
    let pickW; do { pickW = more[Math.floor(Math.random()*more.length)]; } while(more.length>1 && alphaSurprise && pickW.k===alphaSurprise.k);
    alphaSurprise = pickW; explored.add(pickW.k); store.set('explored',[...explored]);
    refreshWords(); $('wxPanel').scrollTop = 0; say(pickW.k);
  }
});

/* Boot */
buildNav();
renderPage();
</script>
